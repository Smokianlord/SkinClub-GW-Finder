name: Build Windows app

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile
        shell: pwsh
        run: ./scripts/build.ps1 -Output "$PWD/SkinClubGWFinder.exe"

      - name: UI and persistence tests
        shell: pwsh
        run: ./tests/run.ps1

      - name: Browser lifecycle tests
        shell: pwsh
        run: ./tests/run-browser.ps1

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: SkinClub-GW-Finder-Windows
          path: |
            SkinClubGWFinder.exe
            SkinClubGWFinder.ico
            README.md
